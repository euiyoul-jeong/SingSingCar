<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2e7d32" />
    <title>영우의 씽씽 자동차</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='22' y='8' width='56' height='84' rx='16' fill='%23e53935'/%3E%3Crect x='30' y='26' width='40' height='16' rx='5' fill='%2390caf9'/%3E%3C/svg%3E" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #2e7d32;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        width: 100%;
        height: 100%;
      }

      /* ───── 웹 전용: 안드로이드 앱 받기 (src/web/downloadUi.js) ───── */
      body.web {
        display: flex;
        flex-direction: column;
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      }
      body.web #game {
        flex: 1 1 auto;
        min-height: 0;
        min-width: 0;
        height: auto;
      }
      .dl-panel {
        display: none;
      }
      .dl-bar {
        flex: none;
        height: 60px;
        border: 0;
        background: #ff9800;
        color: #fff;
        font: bold 22px "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        cursor: pointer;
      }
      .dl-bar:active {
        background: #f57c00;
      }
      .dl-icon {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
      }
      .dl-panel h2,
      .dl-sheet h2 {
        margin: 12px 0;
        font-size: 24px;
        color: #37474f;
      }
      .dl-btn {
        display: block;
        margin: 12px 0;
        padding: 16px;
        border-radius: 22px;
        background: #ff9800;
        color: #fff;
        font-size: 22px;
        font-weight: bold;
        text-align: center;
        text-decoration: none;
        box-shadow: 0 6px 0 rgba(0, 0, 0, 0.2);
      }
      .dl-qr svg {
        display: block;
        width: 200px;
        height: 200px;
        margin: 0 auto;
      }
      .dl-hint {
        margin: 6px 0 0;
        font-size: 14px;
        color: #607d8b;
      }
      .dl-steps {
        margin: 8px 0 0;
        padding-left: 20px;
        text-align: left;
        font-size: 15px;
        line-height: 1.6;
        color: #37474f;
      }
      .dl-modal {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: rgba(0, 0, 0, 0.55);
      }
      .dl-modal[hidden] {
        display: none;
      }
      .dl-sheet {
        width: 100%;
        max-width: 380px;
        padding: 24px 20px;
        border-radius: 28px;
        background: #fff;
        text-align: center;
      }
      .dl-close {
        margin-top: 16px;
        padding: 10px 28px;
        border: 0;
        border-radius: 20px;
        background: #eceff1;
        color: #37474f;
        font: bold 18px "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        cursor: pointer;
      }
      /* PC처럼 넓은 가로 화면: 게임 오른쪽에 QR 패널, 아래 띠는 숨김 */
      @media (min-width: 900px) and (min-aspect-ratio: 1/1) {
        body.web {
          flex-direction: row;
        }
        body.web .dl-bar {
          display: none;
        }
        body.web .dl-panel {
          display: block;
          flex: none;
          width: 300px;
          align-self: center;
          margin-right: 32px;
          padding: 24px 20px;
          border-radius: 28px;
          background: #fff;
          text-align: center;
          box-shadow: 0 8px 0 rgba(0, 0, 0, 0.2);
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
